<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apk Premium Jayy - Apk Premium Cepat & Murah</title>

    <meta name="description" content="Apk Premium Jayy menyediakan aplikasi premium dengan proses cepat dan harga murah.">
    <meta name="keywords" content="apk premium, alight motion premium, aplikasi premium">
    <meta name="author" content="Apk Premium Jayy">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================
         LOADING SCREEN
    ========================== -->
    <div class="loading-screen" id="loadingScreen" aria-label="Loading Screen">
        <div class="loading-content">
            <h1 class="loading-logo">Apk Premium Jayy</h1>
        </div>
    </div>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">
        <div class="container">

            <div class="header-content">
                <h1 class="site-title">Apk Premium</h1>
                <p class="site-subtitle">
                    Apk Premium Cepat &amp; Murah
                </p>
            </div>

        </div>
    </header>

    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="main-content">

        <section class="apk-section" aria-labelledby="apk-list-title">

            <div class="container">

                <h2 id="apk-list-title" class="section-title">
                    Daftar Aplikasi
                </h2>

                <!-- Grid APK -->
                <div class="apk-grid">

                    <!-- APK CARD -->
                    <article
                        class="apk-card"
                        data-apk-name="Alight Motion">

                        <figure class="apk-card-image">
                            <img
                                src="assets/am.png"
                                alt="Alight Motion"
                                loading="lazy">
                        </figure>

                        <div class="apk-card-content">
                            <h3 class="apk-name">
                                Alight Motion
                            </h3>
                        </div>

                    </article>

                </div>

            </div>

        </section>

    </main>

    <!-- =========================
         TOAST CONTAINER
    ========================== -->
    <div
        id="toastContainer"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true">
    </div>

    <!-- =========================
         MAIN JAVASCRIPT
    ========================== -->
    <script src="script.js"></script>

</body>
</html>
